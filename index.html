<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070909" />
    <title>AI Tech Companies are Selling Our Future for a Profit</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-width: 320px;
        color: #d8ded0;
        background: #070909;
        font-family: "Courier New", Courier, monospace;
        image-rendering: pixelated;
      }
      button { font: inherit; }
      .shell {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 26px 0 42px;
      }
      .masthead { border-bottom: 3px solid #566058; padding-bottom: 17px; text-align: center; }
      h1, h2, p { margin: 0; }
      .title { color: #f0e2c4; font-size: clamp(1.4rem, 3.6vw, 2.8rem); line-height: 1.08; letter-spacing: .035em; text-shadow: 3px 3px 0 #252a27; }
      .subtitle { margin-top: 11px; color: #da493c; font-size: clamp(.72rem, 1.8vw, .95rem); line-height: 1.4; letter-spacing: .12em; }
      .screen { position: relative; overflow: hidden; margin-top: 20px; border: 4px solid #566058; background: #121615; box-shadow: 8px 8px 0 #020303; }
      .screen::before, .screen::after { content: ""; position: absolute; left: 0; width: 100%; height: 2px; pointer-events: none; z-index: 2; background: rgba(210, 220, 200, .05); }
      .screen::before { top: 28%; } .screen::after { top: 68%; }
      canvas { display: block; width: 100%; height: auto; min-height: 320px; background: #121615; }
      .panel { display: grid; place-items: center; gap: 12px; margin-top: 20px; }
      .action-wrap { position: relative; display: grid; place-items: center; min-width: 220px; min-height: 220px; overflow: visible; }
      #fireButton {
        position: relative; z-index: 2; width: 146px; height: 146px; border: 7px solid #ff7765; border-radius: 50%; color: transparent; background: #bc231e;
        box-shadow: 0 9px 0 #631614, 0 14px 0 #050606, inset 0 5px 0 #f25b4b; cursor: pointer;
      }
      #fireButton:hover { background: #d12a22; } #fireButton:active, #fireButton.pressed { transform: translateY(8px); box-shadow: 0 1px 0 #631614, 0 6px 0 #050606, inset 0 3px 0 #f25b4b; }
      #fireButton:focus-visible { outline: 3px solid #f0c04e; outline-offset: 5px; }
      #finger { position: absolute; z-index: 4; top: -250px; left: calc(50% - 64px); width: 128px; height: 350px; opacity: 0; pointer-events: none; transform: translateY(-320px); transition: none; }
      #finger::before { content: ""; position: absolute; top: 0; left: 28px; width: 72px; height: 278px; border: 5px solid #401f17; border-radius: 28px 28px 18px 18px; background: #ca795d; box-shadow: inset -17px 0 #9e543f, inset 10px 0 #e4a27a; }
      #finger::after { content: ""; position: absolute; top: 236px; left: 43px; width: 43px; height: 116px; border: 5px solid #401f17; border-radius: 20px 20px 14px 14px; background: #d88c69; box-shadow: inset -10px 0 #ad614a, inset 0 13px #e7b28a; }
      #finger.strike { animation: finger-strike .9s steps(7, end); }
      @keyframes finger-strike { 0% { opacity: 0; transform: translateY(-320px); } 12% { opacity: 1; } 56% { opacity: 1; transform: translateY(96px); } 72% { opacity: 1; transform: translateY(84px); } 100% { opacity: 0; transform: translateY(-320px); } }
      #resetButton { border: 2px solid #8d9890; padding: 8px 13px; color: #d8ded0; background: #171b19; font-size: .7rem; letter-spacing: .13em; cursor: pointer; }
      #resetButton:hover { border-color: #f0c04e; color: #f0e2c4; } #resetButton:focus-visible { outline: 3px solid #f0c04e; outline-offset: 3px; }
      #splash { position: absolute; z-index: 8; inset: 0; display: grid; place-items: center; padding: 22px; opacity: 0; pointer-events: none; background: rgba(18, 14, 10, 0); transition: opacity .1s linear; }
      #splash.show { opacity: 1; background: rgba(18, 14, 10, .88); animation: splash-out 1.9s ease-out forwards; }
      #splash p { position: relative; max-width: 92%; color: #eee1c9; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 7vw, 5.4rem); font-style: italic; font-weight: 400; letter-spacing: .015em; line-height: .94; text-align: center; text-shadow: 3px 4px 0 #7e3027, -1px -1px 0 #342018; transform: rotate(-2deg); }
      #splash p::before, #splash p::after { content: ""; position: absolute; top: 50%; width: 20%; height: 2px; background: #d89167; } #splash p::before { right: calc(100% + 18px); } #splash p::after { left: calc(100% + 18px); }
      @keyframes splash-out { 0%, 55% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }
      @media (max-width: 680px) { .panel { grid-template-columns: 1fr; gap: 8px; } .action-wrap { min-height: 190px; } canvas { min-height: 250px; } #splash p { font-size: 2rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <h1>AI Tech Companies are Selling<br>Our Future for a Profit</h1>
          <p class="subtitle">DESTROY THE AI INDUSTRIAL COMPLEX</p>
        </div>
      </header>

      <section class="screen" aria-label="Pixel-art map of the United States with data center targets">
        <canvas id="map" width="1100" height="570" role="img" aria-label="Bleak United States map showing AI company data-center targets"></canvas>
        <div id="splash" aria-live="assertive" aria-atomic="true"><p>populus perseverabit</p></div>
      </section>

      <section class="panel" aria-label="Launch controls">
        <div class="action-wrap">
          <div id="finger" aria-hidden="true"></div>
          <button id="fireButton" type="button" aria-label="Activate simulation and disable the next data center target"></button>
        </div>
        <button id="resetButton" type="button">RESET MAP</button>
      </section>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById('map');
        const ctx = canvas.getContext('2d');
        const button = document.getElementById('fireButton');
        const finger = document.getElementById('finger');
        const resetButton = document.getElementById('resetButton');
        const splash = document.getElementById('splash');
        const W = canvas.width, H = canvas.height;
        const usaMap = new Image();
        usaMap.src = 'assets/us-map-v1.png';
        const targets = [
          { name: 'AMAZON', x: 173, y: 168, lx: 145, ly: 138, align: 'right' },
          { name: 'META', x: 207, y: 295, lx: 130, ly: 300, align: 'right' },
          { name: 'OPENAI', x: 332, y: 340, lx: 295, ly: 382, align: 'right' },
          { name: 'NVIDIA', x: 456, y: 251, lx: 466, ly: 220, align: 'left' },
          { name: 'MICROSOFT', x: 585, y: 234, lx: 597, ly: 198, align: 'left' },
          { name: 'XAI', x: 600, y: 410, lx: 614, ly: 448, align: 'left' },
          { name: 'GOOGLE DEEPMIND', x: 788, y: 241, lx: 780, ly: 198, align: 'right' },
          { name: 'ANTHROPIC', x: 872, y: 319, lx: 911, ly: 351, align: 'left' }
        ].map((target, id) => ({ ...target, id, state: 'active', blast: 0, bomb: null }));
        let lastTime = 0, splashTimer;

        function pixelRect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
        function drawBackground(t) {
          pixelRect(0, 0, W, H, '#121615');
          for (let y = 0; y < H; y += 8) pixelRect(0, y, W, 1, 'rgba(167,183,150,.035)');
          for (let i = 0; i < 78; i++) { const x = (i * 199) % W, y = (i * 109) % H; pixelRect(x, y, 2, 2, '#3d453d'); }
          if (usaMap.complete && usaMap.naturalWidth) ctx.drawImage(usaMap, 40, 30, 1020, 490);
        }
        function drawTarget(target, t) {
          const pulse = Math.floor(t / 180) % 2;
          if (target.state === 'active') {
            ctx.strokeStyle = '#f0c04e'; ctx.lineWidth = 3;
            ctx.strokeRect(target.x - 12, target.y - 12, 24, 24);
            pixelRect(target.x - 2, target.y - 2, 5, 5, '#f7e2a6');
            ctx.strokeStyle = pulse ? '#d73d31' : '#f0c04e'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(target.x - 20, target.y); ctx.lineTo(target.x + 20, target.y); ctx.moveTo(target.x, target.y - 20); ctx.lineTo(target.x, target.y + 20); ctx.stroke();
          } else {
            pixelRect(target.x - 12, target.y - 3, 25, 7, '#4e211c');
            pixelRect(target.x - 4, target.y - 12, 7, 25, '#4e211c');
            pixelRect(target.x - 3, target.y - 3, 7, 7, '#d33a2e');
          }
          ctx.strokeStyle = target.state === 'active' ? '#75806d' : '#5c3934'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(target.x, target.y); ctx.lineTo(target.lx, target.ly + 5); ctx.stroke();
          ctx.font = 'bold 10px monospace'; ctx.fillStyle = target.state === 'active' ? '#d7e0c7' : '#9c5c50';
          ctx.textAlign = target.align;
          ctx.fillText(target.name, target.lx, target.ly);
          ctx.font = '9px monospace'; ctx.fillText('AI DATA CENTER', target.lx, target.ly + 12);
          ctx.textAlign = 'left';
        }
        function drawBomb(bomb) {
          pixelRect(bomb.x - 4, bomb.y - 8, 9, 18, '#e9d6a5'); pixelRect(bomb.x - 6, bomb.y - 10, 13, 5, '#d24938');
          ctx.strokeStyle = '#c7a86b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bomb.x, bomb.y - 11); ctx.lineTo(bomb.x, bomb.y - 29); ctx.stroke();
          pixelRect(bomb.x - 1, bomb.y - 34, 3, 5, '#d24938');
        }
        function drawBlast(target) {
          const p = target.blast;
          const r = 7 + p * 52;
          ctx.fillStyle = `rgba(245, ${Math.max(67, 225 - p * 130)}, 45, ${1 - p})`;
          ctx.beginPath(); ctx.arc(target.x, target.y, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = `rgba(255,235,166,${Math.max(0,1-p*1.7)})`; ctx.beginPath(); ctx.arc(target.x, target.y, Math.max(2, r*.48), 0, Math.PI*2); ctx.fill();
          for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + .12; pixelRect(target.x + Math.cos(a) * r * 1.3 - 3, target.y + Math.sin(a) * r * 1.3 - 3, 7, 7, '#df4a2f'); }
        }
        function showSplash() {
          clearTimeout(splashTimer);
          splash.classList.remove('show');
          void splash.offsetWidth;
          splash.classList.add('show');
          splashTimer = setTimeout(() => splash.classList.remove('show'), 1930);
        }
        function draw(t) {
          const dt = Math.min(34, t - lastTime || 16); lastTime = t;
          drawBackground(t);
          targets.forEach(target => {
            if (target.bomb) { target.bomb.y += dt * .26; drawBomb(target.bomb); if (target.bomb.y >= target.y) { target.bomb = null; target.state = 'destroyed'; target.blast = .01; showSplash(); } }
            drawTarget(target, t);
            if (target.blast > 0) { drawBlast(target); target.blast += dt / 800; if (target.blast > 1) target.blast = 0; }
          });
          requestAnimationFrame(draw);
        }
        function sound(type) {
          try {
            const Audio = window.AudioContext || window.webkitAudioContext; const ac = new Audio();
            const now = ac.currentTime;
            if (type === 'fall') {
              const osc = ac.createOscillator(), gain = ac.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(760, now); osc.frequency.exponentialRampToValueAtTime(110, now + .62); gain.gain.setValueAtTime(.045, now); gain.gain.exponentialRampToValueAtTime(.001, now + .64); osc.connect(gain).connect(ac.destination); osc.start(now); osc.stop(now + .65);
            } else {
              const osc = ac.createOscillator(), gain = ac.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(85, now); osc.frequency.exponentialRampToValueAtTime(30, now + .42); gain.gain.setValueAtTime(.16, now); gain.gain.exponentialRampToValueAtTime(.001, now + .45); osc.connect(gain).connect(ac.destination); osc.start(now); osc.stop(now + .46);
            }
          } catch (_) {}
        }
        function launch() {
          const target = targets.find(item => item.state === 'active');
          if (!target) { button.disabled = true; button.style.filter = 'grayscale(1)'; return; }
          button.disabled = true; finger.classList.remove('strike'); void finger.offsetWidth; finger.classList.add('strike'); button.classList.add('pressed');
          setTimeout(() => { target.bomb = { x: target.x, y: 50 }; sound('fall'); }, 260);
          setTimeout(() => { sound('boom'); button.disabled = false; button.classList.remove('pressed'); }, 1160);
        }
        function resetMap() {
          targets.forEach(target => { target.state = 'active'; target.blast = 0; target.bomb = null; });
          clearTimeout(splashTimer); splash.classList.remove('show');
          button.disabled = false; button.style.filter = '';
        }
        button.addEventListener('click', launch);
        resetButton.addEventListener('click', resetMap);
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
